[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "biocall-studio"
version = "0.1.0a0"
description = "Native bioacoustics workspace for model training and call detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bioacoustics-dl-toolbox[rf]==0.3.0",
  "alp-ui==0.1.0a1",
  "joblib>=1.4,<2",
  "numpy>=2,<3",
  "PySide6-Addons>=6.11,<6.12",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.14,<1"]
integration = ["pytest-qt>=4.5,<5"]

[project.scripts]
biocall-studio = "biocall_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biocall_studio"]

[tool.hatch.build.targets.wheel.force-include]
"docs/science/TRAINING_CONFIGURATION_FIELDS.json" = "biocall_studio/train/data/TRAINING_CONFIGURATION_FIELDS.json"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not soak'"
markers = [
  "integration: real filesystem or component boundary",
  "qt: real Qt widget/model integration",
  "native_cocoa: visible macOS Cocoa behavior excluded from background test runs",
  "packaged: native packaged executable",
  "soak: explicitly invoked long-duration durability verification",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.biocall-studio.science]
bioacoustics-dl-toolbox-version = "0.3.0"
bioacoustics-dl-toolbox-revision = "7027bd84cc5a44a27bf201332af540f090c38365"
bioacoustics-dl-toolbox-wheel-url = "https://github.com/darizae/bioacoustics-dl-toolbox/releases/download/v0.3.0/bioacoustics_dl_toolbox-0.3.0-py3-none-any.whl"
bioacoustics-dl-toolbox-wheel-sha256 = "c0f7679cbf788c2900eff26b8db719941a513fc96b5f28348e2838c8df595b28"
alp-ui-version = "0.1.0a1"
alp-ui-revision = "41bac72971b96d352da752cc0ff140afe3ac312a"
alp-ui-wheel-url = "https://github.com/darizae/alp-ui/releases/download/v0.1.0a1/alp_ui-0.1.0a1-py3-none-any.whl"
alp-ui-wheel-sha256 = "20590366d06591837c2567df1191b472b9db494e5440ce3a3fadfbf1b8d53d6c"
