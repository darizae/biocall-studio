[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "biocall-studio"
version = "0.1.0a0"
description = "Native bioacoustics workspace for model training and call detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "bioacoustics-dl-toolbox[rf]==0.2.0",
  "alp-ui==0.1.0a0",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.14,<1"]
integration = ["pytest-qt>=4.5,<5"]

[project.scripts]
biocall-studio = "biocall_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biocall_studio"]

[tool.hatch.build.targets.wheel.force-include]
"docs/science/TRAINING_CONFIGURATION_FIELDS.json" = "biocall_studio/train/data/TRAINING_CONFIGURATION_FIELDS.json"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not soak'"
markers = [
  "integration: real filesystem or component boundary",
  "qt: real Qt widget/model integration",
  "packaged: native packaged executable",
  "soak: explicitly invoked long-duration durability verification",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.biocall-studio.science]
bioacoustics-dl-toolbox-version = "0.2.0"
bioacoustics-dl-toolbox-revision = "22c1b342918b33c62288f23b660aa716f3e361e6"
alp-ui-version = "0.1.0a0"
alp-ui-revision = "8cdc91f56005fcd0f3c4004b66016b3d237a10c3"
