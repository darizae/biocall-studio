name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python scripts/verify_handoff.py
      - run: python scripts/check_fixtures.py
      - run: python -m pytest -q tests/unit
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/audit_test_ids.py
